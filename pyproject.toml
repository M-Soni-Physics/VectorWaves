[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorwaves"
dynamic = ["version"]
description = "Three-dimensional electromagnetic field simulation and topology analysis"
authors = [
  { name = "Mayank Soni" }
]
readme = "README_PyPi.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

# CORE DEPENDENCIES
dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "numba>=0.59.0" 
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering",
]

keywords = [
    "physics",
    "optics",
    "wave-optics",
    "vector-optics",
    "electromagnetism",
    "electromagnetic-fields",
    "structured-light",
    "gaussian-beams",
    "laguerre-gaussian",
    "plane-wave-expansion",
    "computational-physics",
    "optical-singularities",
    "polarization-singularities",
    "phase-singularities",
    "topological-optics",
    "optical-vortices"
]

[project.urls]
Homepage = "https://github.com/M-Soni-Physics/VectorWaves"
Repository = "https://github.com/M-Soni-Physics/VectorWaves"
Issues = "https://github.com/M-Soni-Physics/VectorWaves/issues"
Documentation = "https://M-Soni-Physics.github.io/VectorWaves" 

[project.optional-dependencies]
viz = [
  "matplotlib>=3.7.0",
  "pyvista>=0.40.0"
]

progress = [
  "tqdm>=4.65.0"
]

gpu = [
  "cupy-cuda12x>=12.0.0"
]

all = [
  "matplotlib>=3.7.0",
  "pyvista>=0.40.0",
  "tqdm>=4.65.0",
  "cupy-cuda12x>=12.0.0"
]

test = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0"
]

[tool.setuptools.dynamic]
version = { attr = "vectorwaves.version.current_version_str" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider --import-mode=importlib"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true